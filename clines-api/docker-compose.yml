services:
  database:
    image: postgres:13
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clines
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    image: caelum/clines-api
    environment:
      DB_HOST: database
    ports:
      - "8080:8080"
volumes:
  db_data:
